name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Deploy to Firebase Hosting using Firebase CLI
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "${FIREBASE_SERVICE_ACCOUNT}" > ./service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service-account.json"
            npx firebase-tools deploy --only hosting --project hazel-observer-d8chg --non-interactive
            rm -f ./service-account.json
          elif [ -n "${FIREBASE_TOKEN}" ]; then
            npx firebase-tools deploy --only hosting --project hazel-observer-d8chg --token "${FIREBASE_TOKEN}" --non-interactive
          else
            echo "::error::No deployment credentials found. Please set either FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN in GitHub repository secrets."
            exit 1
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAZEL_OBSERVER_D8CHG || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
